<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VM Barbershop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form id="formLogin">
            <h2>VM Barbershop</h2>
            <p style="text-align: center; margin-top: -15px; color: #888;">Inicia sesión para reservar</p>
            
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            
            <button type="submit">ENTRAR</button>
            
            <p style="font-size: 0.9em; text-align: center; color: #666; margin-top: 15px;">
                ¿No tienes cuenta? <a href="registro.html" style="color: #d4af37; text-decoration: none; font-weight: bold;">¡Regístrate ya!</a>
            </p>
        </form>
    </div>
    <script src="login.js"></script>
</body>
</html>
